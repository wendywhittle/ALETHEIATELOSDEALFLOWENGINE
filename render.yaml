# Render blueprint for the AletheiaTelos DealFlow Engine.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aletheiatelos-dealflow
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Persistent database. Leave unset for the ephemeral SQLite default.
      # Set this in the Render dashboard (never commit the value) to a
      # PostgreSQL connection string, e.g. from Render Postgres, Neon, or
      # Supabase. Format: postgresql://user:password@host:port/dbname
      - key: DATABASE_URL
        sync: false
