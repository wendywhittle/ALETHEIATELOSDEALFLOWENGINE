<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AletheiaTelos DealFlow Engine{% endblock %}</title>
<style>
  :root { --ink:#1a1a1a; --accent:#1f3864; --muted:#666; --line:#ddd; --bg:#f7f7f8; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:var(--ink); background:var(--bg); margin:0; line-height:1.5; }
  header.top { background:var(--accent); color:#fff; padding:14px 20px; }
  header.top a { color:#fff; text-decoration:none; margin-right:22px; font-size:18px; }
  header.top .brand { font-weight:700; font-size:20px; margin-right:30px; }
  main { max-width:760px; margin:0 auto; padding:24px 18px 60px; }
  h1 { font-size:32px; line-height:1.2; }
  h2 { font-size:24px; margin-top:36px; border-bottom:2px solid var(--line); padding-bottom:8px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px;
          padding:20px; margin:16px 0; }
  label { display:block; font-weight:600; margin:18px 0 6px; font-size:17px; }
  label .opt { font-weight:400; color:var(--muted); font-size:15px; }
  input[type=text], input[type=number], input[type=email], input[type=tel],
  select, textarea {
    width:100%; min-height:54px; font-size:18px; padding:12px 14px;
    border:2px solid var(--line); border-radius:10px; background:#fff; }
  input:focus, select:focus { border-color:var(--accent); outline:none; }
  .btn { display:inline-block; min-height:56px; font-size:20px; font-weight:700;
         padding:14px 30px; border-radius:12px; border:none; cursor:pointer;
         background:var(--accent); color:#fff; text-decoration:none; margin:8px 8px 8px 0; }
  .btn.secondary { background:#fff; color:var(--accent); border:2px solid var(--accent); }
  table { width:100%; border-collapse:collapse; background:#fff; font-size:16px; }
  th, td { text-align:left; padding:12px 10px; border-bottom:1px solid var(--line); }
  th { background:#eef1f6; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:6px 14px; border-radius:20px; font-weight:700;
           background:#eef1f6; color:var(--accent); font-size:16px; }
  .errors { background:#fdecea; border:1px solid #e57373; border-radius:10px;
            padding:14px 18px; margin:16px 0; }
  .disclaimer { background:#fff8e1; border:1px solid #ffca28; border-radius:10px;
            padding:14px 18px; margin:20px 0; font-size:15px; }
  .muted { color:var(--muted); }
  .state { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .wrap { overflow-x:auto; }
  footer { text-align:center; color:var(--muted); font-size:14px; padding:30px 10px; }
  @media (max-width:600px){ h1{font-size:26px;} th,td{padding:10px 6px; font-size:15px;} }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('landing') }}">AletheiaTelos</a>
  <a href="{{ url_for('intake') }}">Enter a deal</a>
  <a href="{{ url_for('pipeline') }}">Pipeline</a>
</header>
<main>
{% block body %}{% endblock %}
</main>
<footer>Analytical decision support only — not investment advice, not a recommendation,
not a guarantee, not a prediction.</footer>
</body>
</html>
